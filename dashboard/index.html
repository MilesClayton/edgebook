<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>edgebook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2372f1c5'/><path d='M7 22l6-7 5 4 7-9' stroke='%23031a18' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">edgebook <span class="tag">KALSHI BTC</span></div>
    <nav id="nav">
      <a data-page="live" class="active" title="What to do right now in each live market: buy UP, buy DOWN, or wait; and hold or sell if you're in.">Live Calls</a>
      <a data-page="paper" title="A simulated $500,000 account that follows the Live Calls automatically, using real order-book prices and fees. No real money.">Paper $500k</a>
      <a data-page="research" title="How each strategy did on 30 days of past markets it never saw while being built.">Research</a>
      <a data-page="calibration" title="Does the model's '70% chance' actually happen 70% of the time? Checked on past markets.">Calibration</a>
      <a data-page="system" title="Is the data live? Ages of every feed and recorder health.">System</a>
    </nav>
    <div class="side-status">
      <div class="label">Data freshness</div>
      <div id="side-status"></div>
    </div>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="page-title">Live Calls</h1>
      <div class="topbar-right">
        <span id="updated" class="muted"></span>
        <button id="refresh" type="button" title="Reload everything now">Refresh</button>
      </div>
    </header>
    <section id="content" aria-live="polite"></section>
    <footer class="muted">Live execution remains gated by fresh data, risk checks, and a separate confirmation for every order. Calls are model output, not financial advice.
      Layout adapted from <a href="https://github.com/ryanfrigo/kalshi-ai-trading-bot" rel="noopener">kalshi-ai-trading-bot</a> (MIT).</footer>
  </main>
</body>
</html>
