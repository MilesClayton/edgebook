# Market data recorder: streams Kalshi production books, trades and the BRTI
# settlement index to Parquet on a Fly volume. Never places orders.
#
# One-time setup (see README "Deploy"):
#   fly apps create edgebook-recorder
#   fly volumes create recorder_data --app edgebook-recorder --region iad --size 40
#   fly secrets set --app edgebook-recorder EDGEBOOK_KALSHI_KEY_ID=... \
#     EDGEBOOK_KALSHI_PRIVATE_KEY="$(cat ~/path/to/kalshi-prod.pem)"

app = "edgebook-recorder"
primary_region = "iad"  # Ashburn, VA: closest Fly region to Kalshi's US-East infrastructure

# SIGINT lets the recorder flush its Parquet buffers before exit.
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  EDGEBOOK_ENV = "paper"  # recorder never trades; market data is always production
  EDGEBOOK_DATA_DIR = "/data"

[processes]
  recorder = "python -m edgebook record"

[[mounts]]
  source = "recorder_data"
  destination = "/data"
  initial_size = "40gb"  # used if deploy has to create the volume (Fly's default is 1GB)
  processes = ["recorder"]

# Dashboard JSON store (recorder/http.py), Bearer-token protected. Never auto-stop:
# stopping the machine would stop recording.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["recorder"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[restart]]
  policy = "always"
  retries = 10
  processes = ["recorder"]

# Measured: ~1,500 msgs/s, ~12% of one core, ~155MB RSS, ~1.5GB/day of Parquet.
[[vm]]
  size = "shared-cpu-4x"
  memory = "1gb"
  processes = ["recorder"]
