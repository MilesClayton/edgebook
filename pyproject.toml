[project]
name = "edgebook"
version = "0.1.0"
description = "Typed quant trading bot for prediction markets (Kalshi BTC first)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgebook"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --cov=edgebook --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
